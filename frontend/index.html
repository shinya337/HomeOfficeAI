<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeOffice.ai - Virtual Coworking Space</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- オフィス空間（常時表示） -->
  <div class="office-space" id="officeSpace">
    <!-- 背景画像（6テーマからランダム） -->
    <div class="office-background" id="officeBackground">
      <img id="bgImage" src="" alt="Virtual Office">
    </div>

    <!-- Terminal Zone - ターミナル風ログ表示 -->
    <div class="terminal-zone" id="terminalZone">
      <div class="terminal">
        <div class="terminal-header">
          <span class="terminal-title">~/homeoffice.log</span>
        </div>
        <div class="terminal-body">
          <ul class="terminal-logs" id="terminalLogs"></ul>
          <div class="terminal-cursor"></div>
        </div>
      </div>
    </div>

    <!-- Avatar Zone - 自分のアイコン（中央下） -->
    <div class="avatar-zone" id="avatarZone">
      <button class="avatar" id="avatarButton" aria-label="仕事を始める">
        <div class="avatar-image" id="avatarImage">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="35" r="25" fill="#6b7280"/>
            <ellipse cx="50" cy="85" rx="35" ry="25" fill="#6b7280"/>
          </svg>
        </div>
      </button>
      <span class="avatar-status" id="avatarStatus">タップで開始</span>
    </div>

    <!-- Timer Display（左下） -->
    <div class="timer-display hidden" id="timerDisplay">
      <div class="timer-time" id="timerTime">00:00:00</div>
    </div>

    <!-- Settings Button -->
    <button class="settings-button" id="settingsButton" aria-label="設定">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="10" cy="10" r="3"/>
        <path d="M10 1v2m0 14v2M1 10h2m14 0h2m-3.3-5.3l1.4-1.4m-12.8 0l1.4 1.4m0 10.6l-1.4 1.4m12.8 0l-1.4-1.4"/>
      </svg>
    </button>
  </div>

  <!-- ミニポップアップ（他アプリ使用時） -->
  <div class="mini-popup hidden" id="miniPopup">
    <div class="mini-timer" id="miniTimer">00:00:00</div>
    <button class="mini-expand" id="miniExpand" aria-label="展開">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M2 2h5v2H4v3H2V2zm7 0h5v5h-2V4H9V2zM4 11v-3H2v5h5v-2H4zm8-3v3h-3v2h5v-5h-2z"/>
      </svg>
    </button>
  </div>

  <!-- 許可リクエストモーダル -->
  <div class="modal hidden" id="permissionModal">
    <div class="modal-card">
      <div class="modal-icon" id="permissionIcon"></div>
      <h2 class="modal-title" id="permissionTitle"></h2>
      <p class="modal-description" id="permissionDescription"></p>
      <div class="modal-actions">
        <button class="modal-button secondary" id="permissionSkip">スキップ</button>
        <button class="modal-button primary" id="permissionAllow">許可する</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal hidden" id="settingsModal">
    <div class="modal-card settings-card">
      <div class="modal-header">
        <h2 class="modal-title">設定</h2>
        <button class="modal-close" id="settingsClose" aria-label="閉じる">&times;</button>
      </div>
      <div class="settings-content">
        <div class="settings-section">
          <h3 class="settings-section-title">アクセス許可</h3>
          <div class="settings-item">
            <div class="settings-item-info">
              <span class="settings-item-icon">📷</span>
              <div>
                <div class="settings-item-label">カメラ</div>
                <div class="settings-item-desc">集中状態の自動検知に使用</div>
              </div>
            </div>
            <div class="settings-item-action">
              <span class="status-badge off" id="cameraStatusBadge">OFF</span>
              <button class="settings-toggle" id="cameraToggle">オンにする</button>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-item-info">
              <span class="settings-item-icon">💡</span>
              <div>
                <div class="settings-item-label">家電制御</div>
                <div class="settings-item-desc">照明・エアコンの自動操作</div>
              </div>
            </div>
            <div class="settings-item-action">
              <span class="status-badge off" id="applianceStatusBadge">OFF</span>
              <button class="settings-toggle" id="applianceToggle">オンにする</button>
            </div>
          </div>
        </div>
        <div class="settings-section" id="deviceListSection">
          <h3 class="settings-section-title">AIに操作を許可するデバイス</h3>
          <div id="deviceListContainer"></div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">アバター</h3>
          <div class="settings-item">
            <div class="settings-item-info">
              <span class="settings-item-icon">👤</span>
              <div>
                <div class="settings-item-label">アイコン画像</div>
                <div class="settings-item-desc">プロフィール画像を設定</div>
              </div>
            </div>
            <div class="settings-item-action">
              <input type="file" id="avatarUpload" accept="image/*" hidden>
              <button class="settings-toggle" id="avatarUploadButton">変更</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- カメラ映像（非表示、キャプチャ用） -->
  <video id="cameraVideo" autoplay playsinline style="display:none;"></video>

  <script type="module" src="app.js"></script>
</body>
</html>
